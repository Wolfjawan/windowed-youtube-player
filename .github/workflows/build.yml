name: Build Windows installer

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version override, for example v0.4.0
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windowed-streaming-player-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore application icon
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String((Get-Content assets/app.ico.b64 -Raw).Trim())
          [IO.File]::WriteAllBytes("src/WindowedYouTubePlayer/app.ico", $bytes)

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet publish src/WindowedYouTubePlayer/WindowedYouTubePlayer.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:ContinuousIntegrationBuild=true `
            --output artifacts/win-x64 2>&1 | Tee-Object artifacts/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer/WindowedStreamingPlayer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem artifacts/installer/WindowedStreamingPlayer-Setup-*.exe | Select-Object -First 1
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $($installer.Name)" | Set-Content artifacts/installer/WindowedStreamingPlayer-Setup.sha256 -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowedStreamingPlayer-Installer
          path: |
            artifacts/installer/WindowedStreamingPlayer-Setup-*.exe
            artifacts/installer/WindowedStreamingPlayer-Setup.sha256
            artifacts/build.log
          if-no-files-found: error

      - name: Select release version
        if: success() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.version }}".Trim()) {
            $tag = "${{ inputs.version }}".Trim()
          } else {
            [xml]$project = Get-Content src/WindowedYouTubePlayer/WindowedYouTubePlayer.csproj
            $tag = "v$($project.Project.PropertyGroup.Version)"
          }
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub Release
        if: success() && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG already exists. Keeping its assets unchanged."
            exit 0
          }

          $installer = Get-ChildItem artifacts/installer/WindowedStreamingPlayer-Setup-*.exe | Select-Object -First 1
          gh release create $env:RELEASE_TAG `
            $installer.FullName `
            artifacts/installer/WindowedStreamingPlayer-Setup.sha256 `
            --repo "${{ github.repository }}" `
            --target main `
            --title "Windowed Streaming Player $env:RELEASE_TAG" `
            --generate-notes
